# Production topology: Bugler alone.
#
# Unlike docker-compose.yml, which raises a whole world for development, this file assumes the
# machine already runs the two things Bugler leans on — a PostgreSQL and a mail relay — and wires
# it to them. There is no postgres service here and no mailpit: mail sent from this file reaches
# real inboxes.
#
# It runs a published image and never builds: the server is not expected to hold the source. See
# DEPLOYMENT.md for where the image comes from and what to ask of whoever administers the database.
# Everything that differs between installations comes from a .env file beside this one.
#
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d

services:
  bugler:
    # Pinned to a version in .env, never to a floating tag: rolling back is then a one-line edit
    # and a restart, and two servers on the same tag are running the same thing.
    image: ${BUGLER_IMAGE:?set BUGLER_IMAGE in .env to the version you were told to run, e.g. ghcr.io/svaca33/bugler:0.20.0}
    restart: unless-stopped
    # The image runs as `app`, not as root, which empties the capabilities the process holds — but
    # not the set it may reach for, which a setuid binary could still climb back into. cap_drop
    # takes them out of that set; no-new-privileges forbids the climb. Bugler wants none of them.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      # Maximum Pool Size is deliberate: the cluster's max_connections is shared with every other
      # database on it, and Npgsql would otherwise help itself to a hundred.
      ConnectionStrings__bugler: "Host=${BUGLER_DB_HOST};Port=${BUGLER_DB_PORT:-5432};Database=${BUGLER_DB_NAME};Username=${BUGLER_DB_USER};Password=${BUGLER_DB_PASSWORD};Maximum Pool Size=20"

      # Where this Bugler is reachable from outside. Every link Bugler puts in a mail or a chat
      # message is built from it, password reset is offered only when it is set — and its scheme
      # is what decides whether the Session cookie is minted `Secure`, since Bugler sees only
      # plain HTTP behind the proxy holding the certificate (ADR 0019). Required, rather than
      # defaulted: a server that starts without knowing its own address starts exposed.
      Server__PublicBaseUrl: "${BUGLER_PUBLIC_BASE_URL:?set BUGLER_PUBLIC_BASE_URL in .env to the address this Bugler answers at, e.g. https://bugler.example.com}"

      Mail__Smtp__Host: "${BUGLER_SMTP_HOST}"
      Mail__Smtp__Port: "${BUGLER_SMTP_PORT:-25}"
      Mail__Smtp__From: "${BUGLER_SMTP_FROM}"
      # Only where the relay asks to be authenticated; an internal relay usually does not.
      # Mail__Smtp__Username: "${BUGLER_SMTP_USERNAME}"
      # Mail__Smtp__Password: "${BUGLER_SMTP_PASSWORD}"

      # Where the machine door is reachable from outside — host and port, no path: Bugler adds its
      # own. It is printed into the connect command shown beside a new Machine Delegation and read
      # nowhere else, so it decides nothing about security (ADR 0030). Uncomment it together with
      # the 8081 port below; without the port nothing can reach the door however this is set.
      # Server__PublicMcpUrl: "${BUGLER_PUBLIC_MCP_URL}"

      # The AI provider Bugler may ask for a reading of an Episode's evidence (ADR 0027). Normally
      # left alone: the same settings are editable on Administration → Server while Bugler runs, are
      # stored in the database, and win whole over these until reset there — which keeps the API key
      # off this machine's filesystem. Unset means AI is off everywhere, and no Application's
      # telemetry leaves without its own AI consent either way (ADR 0028).
      # Ai__Provider: "Anthropic"                  # or OpenAiCompatible for a local Ollama / vLLM
      # Ai__BaseUrl: ""                            # required for OpenAiCompatible, incl. the version segment
      # Ai__ApiKey: "${BUGLER_AI_API_KEY}"
      # Ai__Model: "claude-haiku-4-5"
      # Ai__PatienceSeconds: "60"                  # how long an alert waits for its reading; 0 = never wait

    ports:
      # UI and REST API. Bound to the loopback by default, so the only way in is the reverse proxy
      # terminating TLS on this same machine. Set BUGLER_APP_BIND to 0.0.0.0 when the proxy runs
      # elsewhere — and then let the firewall, not Bugler, decide who reaches it.
      - "${BUGLER_APP_BIND:-127.0.0.1}:8080:8080"

      # OTLP/HTTP. The one surface senders outside the network use, and the reason it must sit
      # behind TLS: an API key travels in the Authorization header of every export.
      - "4318:4318"

      # OTLP/gRPC, for senders on the local network. Reaching it from outside would mean HTTP/2
      # end to end through the proxy; OTLP/HTTP above is the simpler way in.
      - "4317:4317"

      # MCP — the machine door, so an agent at somebody's editor can read this server's telemetry.
      # Left unpublished on purpose: publishing it is a decision of its own, separate from
      # publishing the UI (ADR 0030), and while this line is absent no Machine Delegation and no
      # Admin's switch can be reached from outside the host. Uncomment it, and BUGLER_PUBLIC_MCP_URL
      # above, only when you mean to — behind the same TLS as everything else, because a Machine
      # Delegation's Secret travels in the Authorization header of every call. See DEPLOYMENT.md.
      # - "${BUGLER_MCP_BIND:-127.0.0.1}:8081:8081"

    # The database does not live in this compose file, so it is not a service Bugler can depend on
    # — this is how the container finds it on the host.
    extra_hosts:
      - "host.docker.internal:host-gateway"

    healthcheck:
      # /health answers for the database behind it, so unhealthy here means Bugler cannot serve.
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      # Long enough for the migrations every module runs before the first request is served.
      start_period: 40s
