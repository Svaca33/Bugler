services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bugler
      POSTGRES_USER: bugler
      POSTGRES_PASSWORD: bugler # local development only
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bugler -d bugler"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Local SMTP that goes nowhere: alerts and password-reset links land in its web UI on :8025
  # instead of in somebody's inbox. Messages live in memory only and a restart forgets them.
  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025" # web UI - read the mail here
      - "1025:1025" # SMTP

  bugler:
    build: .
    environment:
      ConnectionStrings__bugler: "Host=postgres;Port=5432;Database=bugler;Username=bugler;Password=bugler"
      # Mail goes to the local mailpit; point this at a real server to have it leave the machine.
      Mail__Smtp__Host: "mailpit"
      Mail__Smtp__Port: "1025"
      Mail__Smtp__From: "bugler@localhost"
      # Mail__Smtp__Username: "bugler"
      # Mail__Smtp__Password: "…"
      # Where this Bugler is reachable from outside; links in mail and chat point at it.
      # Server__PublicBaseUrl: "https://bugler.example.com"
    ports:
      - "8080:8080" # UI + REST API
      - "4317:4317" # OTLP/gRPC
      - "4318:4318" # OTLP/HTTP
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started

volumes:
  postgres-data:
