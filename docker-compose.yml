services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: bugler
      POSTGRES_USER: bugler
      POSTGRES_PASSWORD: bugler # local development only
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bugler -d bugler"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Local SMTP that goes nowhere: alerts and password-reset links land in its web UI on :8025
  # instead of in somebody's inbox. Messages live in memory only and a restart forgets them.
  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    ports:
      - "8025:8025" # web UI - read the mail here
      - "1025:1025" # SMTP

  bugler:
    build: .
    # Docker starts containers again when the daemon does, but it does not honour depends_on then:
    # Bugler can come up before PostgreSQL is listening, and migrating at startup is the first
    # thing it tries. Without this the process exits and stays exited; with it the next attempt
    # succeeds moments later.
    restart: unless-stopped
    # The image already runs as `app` rather than as root, which empties the capabilities the
    # process holds. It does not empty the set it is permitted to reach for — a setuid binary
    # could still climb back into them. cap_drop takes them out of that set; no-new-privileges
    # forbids the climb itself. Bugler wants none of them: its three ports are all above 1024.
    #
    # postgres and mailpit above are left as they are. They are development scaffolding, and
    # postgres in particular chowns its data directory as root before dropping to its own user —
    # take that capability away and a fresh clone never gets its first start.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      ConnectionStrings__bugler: "Host=postgres;Port=5432;Database=bugler;Username=bugler;Password=bugler"
      # Mail goes to the local mailpit; point this at a real server to have it leave the machine.
      Mail__Smtp__Host: "mailpit"
      Mail__Smtp__Port: "1025"
      Mail__Smtp__From: "bugler@localhost"
      # Mail__Smtp__Security: "Automatic" # or None / StartTls / ImplicitTls
      # Mail__Smtp__Username: "bugler"
      # Mail__Smtp__Password: "…"
      # Saving SMTP settings in the UI (Administration → Server) overrides all of the above
      # until reset there (ADR 0014).
      # Where this Bugler is reachable from outside; links in mail and chat point at it, and its
      # scheme decides whether the Session cookie carries `Secure` (ADR 0019). Left unset here on
      # purpose: the default is http://localhost:8080, a loopback address that asks the browser for
      # no TLS this stack can offer. Naming an https address here would sign you out of :8080.
      # Server__PublicBaseUrl: "https://bugler.example.com"
      # Where the machine door is reachable from outside — host and port, no path: Bugler adds its
      # own. Printed into the connect command shown beside a new Machine Delegation's Secret and read
      # nowhere else, so it decides nothing about security (ADR 0030). The door itself stays shut
      # until an Admin opens it in Administration → MCP.
      # Server__PublicMcpUrl: "https://bugler.example.com"
    ports:
      - "8080:8080" # UI + REST API
      - "4317:4317" # OTLP/gRPC
      - "4318:4318" # OTLP/HTTP
      # The machine door (ADR 0030). Publishing it is a choice of its own: leave this line out and
      # the UI stays reachable while no tool can read telemetry from outside the host.
      - "8081:8081" # MCP
    healthcheck:
      # /health answers for the database behind it, so an unhealthy container here means Bugler
      # cannot serve — not merely that it has not finished starting.
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      # Long enough for the migrations every module runs before the first request is served.
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started

volumes:
  postgres-data:
