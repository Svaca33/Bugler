services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bugler
      POSTGRES_USER: bugler
      POSTGRES_PASSWORD: bugler # local development only
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bugler -d bugler"]
      interval: 5s
      timeout: 3s
      retries: 10

  bugler:
    build: .
    environment:
      ConnectionStrings__bugler: "Host=postgres;Port=5432;Database=bugler;Username=bugler;Password=bugler"
      # Alerting: links in messages point at PublicBaseUrl; mail stays disabled until SMTP is set.
      # Alerting__PublicBaseUrl: "https://bugler.example.com"
      # Alerting__Smtp__Host: "smtp.example.com"
      # Alerting__Smtp__Port: "587"
      # Alerting__Smtp__Username: "bugler"
      # Alerting__Smtp__Password: "…"
      # Alerting__Smtp__From: "bugler@example.com"
    ports:
      - "8080:8080" # UI + REST API
      - "4317:4317" # OTLP/gRPC
      - "4318:4318" # OTLP/HTTP
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
